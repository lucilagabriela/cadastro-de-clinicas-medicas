<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Consulta - Clínica Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Clínica Virtual</div>
            <ul>
                <li><a href="dashboard.html">Minhas Consultas</a></li>
                <li><a href="agendar.html" class="btn btn-secondary">Agendar Consulta</a></li>
                <li><a href="index.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Agendar Nova Consulta</h2>
        <form action="resultados-agenda.html" method="GET">
            <div class="form-group">
                <label for="sintomas">Descreva seus sintomas:</label>
                <textarea id="sintomas" name="sintomas" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="especialidade">Selecione a especialidade desejada:</label>
                <select id="especialidade" name="especialidade">
                    <option value="clinica-geral">Clínica Geral</option>
                    <option value="cardiologia">Cardiologia</option>
                    <option value="dermatologia">Dermatologia</option>
                    <option value="ortopedia">Ortopedia</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Buscar Horários</button>
        </form>
    </main>
</body>
</html>
